<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" role="img" aria-label="Lania CLI 双运行时">
  <defs>
    <linearGradient id="space" x1="42" y1="24" x2="478" y2="396" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#13233d"/>
      <stop offset=".55" stop-color="#0a1222"/>
      <stop offset="1" stop-color="#050912"/>
    </linearGradient>
    <radialGradient id="nebula" cx="0" cy="0" r="1" gradientTransform="translate(260 188) rotate(90) scale(180)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#42d392" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#3b82f6" stop-opacity=".09"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="filament" x1="80" y1="304" x2="444" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f9165"/>
      <stop offset=".5" stop-color="#42d392"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="prompt" x1="220" y1="130" x2="320" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c8fff0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="nodeGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="16" y="16" width="488" height="388" rx="32" fill="url(#space)"/>
  <rect x="16.75" y="16.75" width="486.5" height="386.5" rx="31.25" fill="none" stroke="#42d392" stroke-opacity=".18" stroke-width="1.5"/>
  <circle cx="260" cy="188" r="180" fill="url(#nebula)"/>

  <text x="260" y="54" text-anchor="middle" fill="#8fe8d1" fill-opacity=".52" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="4.5">LANIAKEA · CLI</text>

  <g fill="none" stroke="url(#filament)">
    <ellipse cx="260" cy="188" rx="196" ry="72" stroke-width="1.4" opacity=".28" transform="rotate(-18 260 188)"/>
    <ellipse cx="260" cy="188" rx="154" ry="55" stroke-width="1" opacity=".18" transform="rotate(34 260 188)"/>
    <circle cx="260" cy="188" r="84" stroke-width="1.2" opacity=".24"/>
    <path d="M96 122c54-2 104 18 140 52" stroke-width="2.2" stroke-linecap="round" opacity=".5"/>
    <path d="M426 254c-52 4-103-17-139-52" stroke-width="2.2" stroke-linecap="round" opacity=".42"/>
    <path d="M326 78c8 36 0 69-27 94" stroke-width="1.6" stroke-linecap="round" opacity=".3"/>
  </g>

  <g filter="url(#glow)">
    <path d="M226 139 268 188 226 237" fill="none" stroke="url(#prompt)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="275" y="224" width="42" height="13" rx="6.5" fill="url(#filament)"/>
  </g>

  <g filter="url(#nodeGlow)">
    <circle cx="92" cy="122" r="7" fill="#42d392"/>
    <circle cx="428" cy="254" r="7" fill="#67e8f9"/>
    <circle cx="328" cy="76" r="4.5" fill="#8fe8d1"/>
  </g>
  <g fill="#bfffe8" opacity=".9">
    <circle cx="76" cy="108" r="2"/>
    <circle cx="106" cy="104" r="1.4"/>
    <circle cx="80" cy="140" r="1.6"/>
    <circle cx="442" cy="240" r="1.7"/>
    <circle cx="414" cy="270" r="1.4"/>
    <circle cx="312" cy="64" r="1.2"/>
  </g>
  <g fill="#ffffff" opacity=".55">
    <circle cx="158" cy="58" r="1.2"/>
    <circle cx="398" cy="102" r="1"/>
    <circle cx="460" cy="174" r="1.2"/>
    <circle cx="64" cy="224" r="1"/>
    <circle cx="214" cy="320" r="1.1"/>
    <circle cx="362" cy="306" r="1"/>
  </g>

  <text x="92" y="154" text-anchor="middle" fill="#8fe8d1" fill-opacity=".62" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.8">RUST HOST</text>
  <text x="428" y="286" text-anchor="middle" fill="#8fe8d1" fill-opacity=".62" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.8">NODE BRIDGE</text>

  <rect x="56" y="330" width="408" height="48" rx="14" fill="#ffffff" fill-opacity=".06" stroke="#42d392" stroke-opacity=".18"/>
  <text x="260" y="360" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#d8fff0">
    <tspan fill="#67e8f9">&gt;</tspan>
    <tspan fill="#9fb3c8"> lan build</tspan>
    <tspan fill="#42d392"> · </tspan>
    <tspan fill="#9fb3c8">lan create</tspan>
    <tspan fill="#42d392"> · </tspan>
    <tspan fill="#9fb3c8">lan release</tspan>
  </text>
</svg>
