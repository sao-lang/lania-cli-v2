<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Lania CLI">
  <defs>
    <linearGradient id="space" x1="18" y1="8" x2="112" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#13233d"/>
      <stop offset=".55" stop-color="#0a1222"/>
      <stop offset="1" stop-color="#050912"/>
    </linearGradient>
    <radialGradient id="nebula" cx="0" cy="0" r="1" gradientTransform="translate(64 62) rotate(90) scale(54)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#42d392" stop-opacity=".24"/>
      <stop offset=".55" stop-color="#3b82f6" stop-opacity=".08"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="filament" x1="26" y1="92" x2="104" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f9165"/>
      <stop offset=".5" stop-color="#42d392"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="prompt" x1="40" y1="40" x2="92" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c8fff0"/>
    </linearGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="2.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="29" fill="url(#space)"/>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="28.25" fill="none" stroke="#42d392" stroke-opacity=".22" stroke-width="1.5"/>
  <circle cx="64" cy="62" r="54" fill="url(#nebula)"/>

  <g fill="none" stroke="url(#filament)">
    <ellipse cx="64" cy="64" rx="47" ry="19" stroke-width="1.3" opacity=".34" transform="rotate(-26 64 64)"/>
    <ellipse cx="64" cy="64" rx="35" ry="13.5" stroke-width="1" opacity=".2" transform="rotate(34 64 64)"/>
    <path d="M28 52c8-15 22-24 39-24 18 0 32 9 38 24" stroke-width="1.8" stroke-linecap="round" opacity=".42"/>
    <path d="M99 82c-7 17-21 26-38 26-16 0-29-8-36-21" stroke-width="1.8" stroke-linecap="round" opacity=".3"/>
  </g>

  <g filter="url(#glow)">
    <path d="M39.5 40.5 61.5 64 39.5 87.5" fill="none" stroke="url(#prompt)" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="68.5" y="78.5" width="23" height="9" rx="4.5" fill="url(#filament)"/>
  </g>

  <g fill="#bfffe8">
    <circle cx="28" cy="52" r="2.6"/>
    <circle cx="106" cy="48" r="2.2"/>
    <circle cx="99" cy="82" r="2.4"/>
    <circle cx="24" cy="88" r="1.8"/>
  </g>
  <g fill="#ffffff" opacity=".72">
    <circle cx="101" cy="30" r="1.2"/>
    <circle cx="33" cy="29" r="1"/>
    <circle cx="112" cy="66" r="1"/>
    <circle cx="18" cy="68" r=".9"/>
  </g>
</svg>
