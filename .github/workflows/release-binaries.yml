name: Build platform binaries

# 在原生 runner 上构建 lan 二进制，并把产物上传到 GitHub Release，
# 供 scripts/fetch-platform-binaries.mjs 在 pack/publish 阶段下载。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to upload assets to (e.g. v0.0.1)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-14
            target: aarch64-apple-darwin
          - platform: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: win32-x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build lania-cli
        shell: bash
        run: cargo build --release --locked --manifest-path rust/Cargo.toml -p lania-cli --target ${{ matrix.target }}

      - name: Normalize binary name
        shell: bash
        run: |
          set -euo pipefail
          src="rust/target/${{ matrix.target }}/release/lania-cli"
          if [ -f "${src}.exe" ]; then src="${src}.exe"; fi
          mkdir -p dist
          # 资产名必须带平台后缀，否则三个 job 会互相覆盖同一个 release asset。
          cp "$src" "dist/lania-cli-${{ matrix.platform }}"
          chmod +x "dist/lania-cli-${{ matrix.platform }}"
          ls -lh "dist/lania-cli-${{ matrix.platform }}"

      - name: Upload binary to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: ${{ github.event.inputs.version || github.ref_name }}
          body: CLI binaries for ${{ github.event.inputs.version || github.ref_name }}
          files: dist/lania-cli-${{ matrix.platform }}
          fail_on_unmatched_files: true
