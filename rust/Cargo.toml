[workspace]
members = [
  "crates/lania-cli",
  "crates/lania-agent",
  "crates/lania-host",
  "crates/lania-hooks",
  "crates/lania-command",
  "crates/lania-config",
  "crates/lania-preferences",
  "crates/lania-prompt",
  "crates/lania-exec",
  "crates/lania-task",
  "crates/lania-progress",
  "crates/lania-logger",
  "crates/lania-fs",
  "crates/lania-format",
  "crates/lania-validate",
  "crates/lania-git",
  "crates/lania-pm",
  "crates/lania-runtime",
  "crates/runex-core",
  "crates/runex",
  "crates/lania-presentation",
  "crates/lania-node-bridge",
  "crates/lania-bridge-support",
  "crates/lania-py-bridge",
  "crates/lania-go-bridge",
  "crates/lania-dart-bridge",
  "crates/lania-rs-bridge",
  "crates/lania-workflows",
  "crates/lania-plugins-command-locale",
  "crates/lania-plugins-command-dev",
  "crates/lania-plugins-command-build",
  "crates/lania-plugins-command-lint",
  "crates/lania-plugins-command-create",
  "crates/lania-plugins-command-add",
  "crates/lania-plugins-command-git",
  "crates/lania-plugins-command-release",
  "crates/lania-plugins-command-generate",
  "crates/lania-plugins-command-template",
  "crates/lania-plugins-command-tools",
  "crates/lania-plugins-command-env",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.0.3"
license = "MIT"
authors = ["Lania CLI Team"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "process", "io-util", "sync"] }
tokio-util = "0.7"
libc = "0.2"
ignore = "0.4"
notify = "6"
serde_yaml = "0.9"
shell-words = "1"
regex = "1"
tree-sitter = "0.20.10"
tree-sitter-thrift = "0.3.0"
# 自管运行时管理器：HTTP / 归档解压 / 校验
flate2 = "1"
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["rustls"] }
xz2 = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
zstd = "0.13"
