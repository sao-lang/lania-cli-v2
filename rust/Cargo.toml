[workspace]
members = [
  # runtime 设施（项目级动态命令 / 脚手架执行宿主，文档 §5.6 F.1）
  "../packages/runtime/rust/lania-command-runtime",
  "../packages/distribution/cli/rust/lania-cli",
  "../packages/commands/pi/rust",
  "../packages/distribution/cli/rust/lania-host",
  # agent 主包（packages/products/agent/rust/，拆分文档 §3.2）
  "../packages/products/agent/rust/lania-agent-core",
  "../packages/products/agent/rust/lania-agent",
  "../packages/foundation/capabilities/rust/lania-hooks",
  "../packages/foundation/command/rust/lania-command",
  # 测试专用 crate：承接 lania-command 的本地化覆盖测试（拆分文档 §5.1 A.5(7) 步 5）
  "../packages/foundation/command-conformance/rust/lania-command-conformance",
  "../packages/foundation/capabilities/rust/lania-config",
  "../packages/foundation/capabilities/rust/lania-preferences",
  "../packages/foundation/capabilities/rust/lania-prompt",
  "../packages/foundation/capabilities/rust/lania-exec",
  "../packages/foundation/capabilities/rust/lania-task",
  "../packages/foundation/capabilities/rust/lania-progress",
  "../packages/foundation/capabilities/rust/lania-logger",
  "../packages/foundation/capabilities/rust/lania-fs",
  "../packages/foundation/capabilities/rust/lania-format",
  "../packages/foundation/capabilities/rust/lania-validate",
  "../packages/foundation/capabilities/rust/lania-git",
  "../packages/foundation/capabilities/rust/lania-pm",
  "../packages/foundation/capabilities/rust/lania-runtime",
  "../packages/products/runex/rust/runex-core",
  "../packages/products/runex/rust/runex",
  "../packages/foundation/capabilities/rust/lania-presentation",
  "../packages/products/bridge-hub/adaptors/ts/lania-node-bridge",
  "../packages/products/bridge-hub/rust/lania-bridge-support",
  "../packages/products/bridge-hub/adaptors/py/lania-py-bridge",
  "../packages/products/bridge-hub/adaptors/go/lania-go-bridge",
  "../packages/products/bridge-hub/adaptors/dart/lania-dart-bridge",
  "../packages/products/bridge-hub/adaptors/rust/lania-rs-bridge",
  "../packages/foundation/capabilities/rust/lania-workflows",
  # Bridge Hub 主包（packages/products/bridge-hub/rust/），进程内嵌入 CLI 进程
  "../packages/foundation/host-core/rust/lania-host-core",
  "../packages/foundation/cli-kit/rust/lania-cli-kit",
  "../packages/foundation/runex-home/rust/runex-home",
  # 包级偏好配置引擎（决策 #11 / 拆分文档 §10.2）：~/.lania/config/<pkg>.json 按包隔离
  "../packages/foundation/package-config/rust/lania-package-config",
  "../packages/products/bridge-hub/rust/lania-bridge-protocol",
  "../packages/products/bridge-hub/rust/lania-bridge-core",
  "../packages/products/bridge-hub/rust/lania-bridge-bus",
  "../packages/products/bridge-hub/rust/lania-bridge-host",
  "../packages/distribution/cli/rust/lania-plugins-command-locale",
  "../packages/commands/dev/rust",
  "../packages/commands/build/rust",
  "../packages/commands/lint/rust",
  "../packages/commands/create/rust",
  "../packages/commands/add/rust",
  "../packages/commands/git/rust",
  "../packages/commands/release/rust",
  "../packages/commands/generate/rust",
  "../packages/commands/tools/rust",
  "../packages/commands/env/rust",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.0.3"
license = "MIT"
authors = ["Lania CLI Team"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "process", "io-util", "sync"] }
tokio-util = "0.7"
libc = "0.2"
ignore = "0.4"
notify = "6"
serde_yaml = "0.9"
shell-words = "1"
regex = "1"
tree-sitter = "0.20.10"
tree-sitter-thrift = "0.3.0"
# 自管运行时管理器：HTTP / 归档解压 / 校验
flate2 = "1"
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["rustls"] }
xz2 = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
zstd = "0.13"
