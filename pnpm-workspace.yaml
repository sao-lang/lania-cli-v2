packages:
  # packages/* 统一容器（拆分文档 §3.1）：按包内 npm/ 与 ts/ 子目录收口
  - 'packages/**/npm/*'
  - 'packages/**/ts/*'
  # ts/ 即包根的形态（bridge-runtime 核与 bridge-slices 切片）
  - 'packages/**/ts'
  # 直接以包根为 package.json 的 foundation 包（作者侧 DSL / 脚手架资产 / bridge 运行时核）
  - 'packages/foundation/lania'
  - 'packages/foundation/templates'
  - 'packages/foundation/bridge-runtime/ts'
